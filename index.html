<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salute Field Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding-bottom: 80px; }
        .navbar { background-color: #0d6efd; color: white; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); display: flex; gap: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Salute Field App</span>
    </div>
</nav>

<div class="container">
    <!-- Entry Form -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title text-primary">New Invoice Entry</h5>
            <div class="row g-2">
                <div class="col-6"><input type="text" id="invoiceNo" class="form-control" placeholder="Invoice #" required></div>
                <div class="col-6"><input type="date" id="saleDate" class="form-control" required></div>
                <div class="col-12"><input type="text" id="clientName" class="form-control" placeholder="Client Name" required></div>
                <div class="col-6"><input type="text" id="productCode" class="form-control" placeholder="Product Code" required></div>
                <div class="col-6"><input type="text" id="productName" class="form-control" placeholder="Product Name" required></div>
                <div class="col-4"><input type="number" id="qty" class="form-control" placeholder="Qty" required></div>
                <div class="col-4"><input type="number" id="price" class="form-control" placeholder="Price" required></div>
                <div class="col-4"><input type="number" id="discount" class="form-control" placeholder="Disc %" value="0"></div>
                <div class="col-12"><button class="btn btn-primary w-100 mt-2" onclick="addLine()">Add Product Line</button></div>
            </div>
        </div>
    </div>

    <!-- Current Invoice Lines -->
    <h6>Current Invoice Lines</h6>
    <div id="currentLines" class="list-group mb-4 shadow-sm"></div>

    <!-- Saved Invoices (Pending Export) -->
    <h6>Saved Invoices (Offline)</h6>
    <div id="savedInvoices" class="list-group mb-4 shadow-sm"></div>
</div>

<!-- Bottom Action Bar -->
<div class="bottom-bar">
    <button class="btn btn-success w-50 fw-bold" onclick="saveInvoice()">Save Invoice</button>
    <button class="btn btn-warning w-50 fw-bold" onclick="exportToExcel()">Export Excel</button>
</div>

<!-- SheetJS Library for Excel Generation -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
